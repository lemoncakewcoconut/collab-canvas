services:
  collab-canvas:
    build: .
    container_name: collab-canvas
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATA_DIR=/app/data
      - MAX_UPLOAD_MB=25
      - UPLOAD_CHUNK_MB=1
    volumes:
      - ./data:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
